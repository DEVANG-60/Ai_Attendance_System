<!DOCTYPE html>
<html>

<head>

    <title>Edit Student</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">

    <style>

        *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Poppins,sans-serif;
        }

        body{

        background:#0f172a;
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;

        }

        .card{

        width:500px;
        background:#1e293b;
        padding:35px;
        border-radius:15px;

        }

        h2{

        text-align:center;
        color:white;
        margin-bottom:20px;

        }

        input{

        width:100%;
        padding:14px;
        margin-bottom:15px;
        border:none;
        border-radius:8px;

        }

        button{

        width:100%;
        padding:14px;
        background:#2563eb;
        border:none;
        border-radius:8px;
        color:white;
        font-size:16px;
        cursor:pointer;

        }

    </style>

</head>

<body>

<div class="card">

    <h2>Edit Student</h2>

    <form method="POST">

        <input
                name="name"
                value="{{student.Name}}"
                required>

        <input
                name="department"
                value="{{student.Department}}"
                required>

        <input
                name="year"
                value="{{student.Year}}"
                required>

        <input
                name="email"
                value="{{student.Email}}"
                required>

        <button>

            Save Changes

        </button>

    </form>

</div>

</body>

</html>
