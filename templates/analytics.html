<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>Analytics Dashboard</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>

        *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Poppins,sans-serif;
        }

        body{
        background:#0f172a;
        padding:40px;
        color:white;
        }

        h1{
        margin-bottom:30px;
        text-align:center;
        }

        .cards{

        display:grid;
        grid-template-columns:repeat(4,1fr);
        gap:20px;
        margin-bottom:40px;

        }

        .card{

        background:#1e293b;
        padding:25px;
        border-radius:15px;
        text-align:center;
        box-shadow:0 0 20px rgba(0,0,0,.3);

        }

        .card h2{

        font-size:35px;
        margin-top:10px;

        }

        .chart{

        background:#1e293b;
        padding:30px;
        border-radius:20px;

        }

        a{

        text-decoration:none;
        color:white;
        background:#2563eb;
        padding:12px 20px;
        border-radius:10px;

        }

        .top{

        display:flex;
        justify-content:space-between;
        margin-bottom:30px;

        }

    </style>

</head>

<body>

<div class="top">

    <a href="/dashboard">⬅ Dashboard</a>

    <h2>Attendance Analytics</h2>

    <div></div>

</div>

<div class="cards">

    <div class="card">

        <h3>Total Students</h3>

        <h2>{{total}}</h2>

    </div>

    <div class="card">

        <h3>Present Today</h3>

        <h2>{{present}}</h2>

    </div>

    <div class="card">

        <h3>Absent</h3>

        <h2>{{absent}}</h2>

    </div>

    <div class="card">

        <h3>Attendance %</h3>

        <h2>{{percentage}}%</h2>

    </div>

</div>

<div class="chart">

    <canvas id="attendanceChart"></canvas>

</div>

<script>

    const ctx=document.getElementById("attendanceChart");

    new Chart(ctx,{

    type:"bar",

    data:{

    labels:{{labels|safe}},

    datasets:[{

    label:"Attendance Count",

    data:{{values|safe}}

    }]

    }

    });

</script>

</body>

</html>
